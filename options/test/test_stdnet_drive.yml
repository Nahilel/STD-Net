# ------------------------------------------------------------------------
# BasicSR Test Configuration: STD-Net on DRIVE Dataset
# ------------------------------------------------------------------------

name: Test_STDNet_DRIVE
model_type: STDNetModel
num_gpu: 1
manual_seed: 42

# Dataset and DataLoader settings
datasets:
  test:
    name: DRIVE_Test
    type: DRIVEDataset
    images_dir: data/DRIVE/test/images
    fov_dir: data/DRIVE/test/mask
    gt_dir: data/DRIVE/test/1st_manual
    second_gt_dir: data/DRIVE/test/2nd_manual
    split: test
    phase: test
    image_size: [512, 512]
    apply_clahe: true
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
    batch_size: 1
    num_workers: 2

# Network architecture
network_g:
  type: STDNetFullModel
  img_channels: 3
  texture_channels: 3
  hidden_dim: 64
  img_size: 512
  num_classes: 1

# Path settings
path:
  pretrain_network_g: experiments/STDNet_DRIVE/models/net_g_best.pth
  strict_load_g: true

# Validation / Evaluation settings
val:
  save_img: true
  threshold: 0.5

